[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roboinf-benchmark"
version = "1.0.0"
description = "RoboInF policy evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "PyYAML>=6", "Pillow>=9"]
license = {file = "LICENSE"}
readme = "README.md"

[project.scripts]
roboinf = "roboinf_benchmark.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/RoboTwin-MIT.txt"]

[tool.setuptools.packages.find]
include = ["roboinf_benchmark*"]
